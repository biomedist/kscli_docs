{% extends "base.html" %}
{% block title %}행정지도감사 · {{ app_title }}{% endblock %}
{% block header_title %}행정지도감사{% endblock %}
{% block content %}
<section class="intro">
  <a class="back" href="{{ url_for('home') }}">← 목록 선택</a>
  <h1>행정지도감사</h1>
  <p>관리할 항목을 선택하세요.</p>
</section>
<div class="cards">
  {% for m in menu %}
  <a class="card" style="--accent:{{ m.color }}" href="{{ url_for(m.endpoint) }}">
    <span class="card-icon">{{ m.icon }}</span>
    <h2>{{ m.title }}</h2>
    <p>{{ m.desc }}</p>
    <span class="card-go">열기 →</span>
  </a>
  {% endfor %}
</div>
{% endblock %}
