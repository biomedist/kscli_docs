{% extends "base.html" %}
{% block title %}비밀번호 변경 · {{ app_title }}{% endblock %}
{% block header_title %}비밀번호 변경{% endblock %}
{% block content %}
<div class="unlock-wrap">
  <form method="post" class="unlock-card">
    <h1>비밀번호 변경</h1>
    <p>변경하면 다른 컴퓨터에서 열어 둔 금액 자료도 모두 잠깁니다.</p>
    <label>현재 비밀번호
      <input type="password" name="current_password" required autofocus autocomplete="current-password">
    </label>
    <label>새 비밀번호
      <input type="password" name="new_password" minlength="6" required autocomplete="new-password">
    </label>
    <label>새 비밀번호 확인
      <input type="password" name="new_password2" minlength="6" required autocomplete="new-password">
    </label>
    <div class="unlock-actions">
      <a class="btn" href="{{ url_for('audit_home') }}">취소</a>
      <button class="btn primary">변경</button>
    </div>
  </form>
</div>
{% endblock %}
